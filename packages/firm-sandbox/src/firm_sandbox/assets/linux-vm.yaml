# The firm's Linux VM, cloned from the local base image at creation.
# CPUs, memory, disk and the image path are set by linux_vm.py.
vmType: vz
os: Linux
arch: aarch64
mounts: []
mountInotify: false
networks:
  - lima: user-v2
hostResolver:
  enabled: false
# The host's egress proxy resolves names; guest DNS refuses immediately.
dns: [127.0.0.1]
propagateProxyEnv: false
ssh:
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false
  loadDotSSHPubKeys: false
containerd:
  system: false
  user: false
param:
  internal_netplanOptional: "true"
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      rm -f /run/firm-provisioned /run/firm-provisioned.new
      if [ -L /etc/resolv.conf ] || ! grep -qx 'nameserver 127.0.0.1' /etc/resolv.conf; then
        rm -f /etc/resolv.conf
        printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:1\n' > /etc/resolv.conf
      fi
      modprobe -a ip_tables iptable_nat nf_tables
      install -d -o root -g root -m 0755 /var/lib/samba /var/cache/samba /var/log/samba
      install -d -o root -g root -m 0700 /var/lib/samba/private
      if [ ! -f /var/lib/samba/private/secrets.tdb ]; then
        net getlocalsid
      fi
      if [ ! -s /etc/ssl/private/ssl-cert-snakeoil.key ] \
        || [ ! -s /etc/ssl/certs/ssl-cert-snakeoil.pem ]; then
        make-ssl-cert generate-default-snakeoil --force-overwrite
      fi
      for command in mount.cifs setfacl smbpasswd smbd newuidmap newgidmap dbus-run-session \
        docker uv node npm claude codex agy gh git curl xz gcc g++ make modprobe; do
        command -v "$command" >/dev/null
      done
      test -x /usr/local/lib/agy/agy
      printf 'firm-linux-provisioned-v1\n' > /run/firm-provisioned.new
      mv /run/firm-provisioned.new /run/firm-provisioned
